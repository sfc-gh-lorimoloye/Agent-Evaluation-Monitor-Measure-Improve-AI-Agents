name: Agent CI/CD - Evaluate & Deploy

on:
  pull_request:
    paths:
      - 'configs/agent_spec.yaml'
      - 'configs/eval_config.yaml'
  workflow_dispatch:
    inputs:
      skip_eval:
        description: 'Skip evaluation and deploy directly'
        type: boolean
        default: false

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  AGENT_DATABASE: MARKETING_CAMPAIGNS_DB
  AGENT_SCHEMA: AGENTS
  AGENT_NAME: MARKETING_CAMPAIGNS_AGENT
  EVAL_STAGE: MARKETING_CAMPAIGNS_DB.AGENTS.EVAL_CONFIG_STAGE
  ANSWER_CORRECTNESS_THRESHOLD: 0.75
  LOGICAL_CONSISTENCY_THRESHOLD: 0.80

jobs:
  deploy-candidate:
    name: Deploy Candidate Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.deploy.outputs.version_name }}
      run_name: ${{ steps.deploy.outputs.run_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install snowflake-connector-python pyyaml

      - name: Deploy candidate agent spec
        id: deploy
        run: |
          python scripts/deploy_candidate.py \
            --agent-spec configs/agent_spec.yaml \
            --database ${{ env.AGENT_DATABASE }} \
            --schema ${{ env.AGENT_SCHEMA }} \
            --agent-name ${{ env.AGENT_NAME }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ env.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ env.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ env.SNOWFLAKE_PASSWORD }}

  evaluate:
    name: Run Evaluation
    needs: deploy-candidate
    if: ${{ github.event.inputs.skip_eval != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      summary: ${{ steps.gate.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install snowflake-connector-python pyyaml

      - name: Upload eval config & start evaluation
        id: start_eval
        run: |
          python scripts/run_evaluation_ci.py \
            --eval-config configs/eval_config.yaml \
            --stage ${{ env.EVAL_STAGE }} \
            --database ${{ env.AGENT_DATABASE }} \
            --schema ${{ env.AGENT_SCHEMA }} \
            --run-name "${{ env.AGENT_NAME }}_ci_${{ github.run_number }}_$(date +%Y%m%d%H%M%S)"

      - name: Poll evaluation status
        id: poll
        run: |
          python scripts/poll_evaluation.py \
            --run-name "${{ steps.start_eval.outputs.run_name }}" \
            --stage ${{ env.EVAL_STAGE }} \
            --config-filename eval_config.yaml \
            --database ${{ env.AGENT_DATABASE }} \
            --schema ${{ env.AGENT_SCHEMA }} \
            --timeout 900 \
            --poll-interval 30

      - name: Quality gate check
        id: gate
        run: |
          python scripts/quality_gate.py \
            --database ${{ env.AGENT_DATABASE }} \
            --schema ${{ env.AGENT_SCHEMA }} \
            --agent-name ${{ env.AGENT_NAME }} \
            --run-name "${{ steps.start_eval.outputs.run_name }}" \
            --answer-correctness-threshold ${{ env.ANSWER_CORRECTNESS_THRESHOLD }} \
            --logical-consistency-threshold ${{ env.LOGICAL_CONSISTENCY_THRESHOLD }}

      - name: Post evaluation results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('evaluation_summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  promote:
    name: Promote to Production
    needs: [deploy-candidate, evaluate]
    if: ${{ needs.evaluate.outputs.passed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Promote to production
        run: |
          python scripts/promote_version.py \
            --database ${{ env.AGENT_DATABASE }} \
            --schema ${{ env.AGENT_SCHEMA }} \
            --agent-name ${{ env.AGENT_NAME }} \
            --alias production

  rollback:
    name: Rollback (Manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Rollback to previous version
        run: |
          python scripts/rollback.py \
            --database ${{ env.AGENT_DATABASE }} \
            --schema ${{ env.AGENT_SCHEMA }} \
            --agent-name ${{ env.AGENT_NAME }}
